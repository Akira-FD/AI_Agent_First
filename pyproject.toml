[project]
name = "ai-agent-first"
version = "0.1.0"
description = "Local MVP skeleton for an enterprise knowledge and ops agent."
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.11.0",
]

[project.optional-dependencies]
rag = [
    "pymilvus[milvus_lite]>=2.5.0",
    "FlagEmbedding>=1.3.3",
    "transformers>=4.44.2,<5.0.0",
]

[tool.unittest]
start-dir = "tests"
